<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="AuraMenu Staff — Orders & Waiter Calls">
  <title>AuraMenu Staff</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="pin-screen" class="screen active">
    <div class="pin-container">
      <div class="pin-logo">
        <div class="pin-icon">🍽️</div>
        <h1 class="pin-title">AuraMenu Staff</h1>
        <p class="pin-subtitle">Enter your staff PIN to continue</p>
      </div>
      <div class="pin-form">
        <input type="password" id="pin-input" inputmode="numeric" maxlength="20" placeholder="Enter PIN" autocomplete="off" autofocus>
        <p id="pin-error" class="error-text"></p>
        <button id="pin-submit" class="btn-primary"><span>Login</span></button>
      </div>
    </div>
  </div>

  <div id="dashboard" class="screen">
    <header class="header" id="header">
      <div class="header-top">
        <div class="header-left">
          <span class="header-emoji">🍽️</span>
          <h1 class="header-title">Staff Panel</h1>
          <span class="live-dot" title="Connected"></span>
        </div>
        <div class="header-right">
          <button id="settings-btn" class="icon-btn" title="Same Dish Match Settings"><span style="font-size:15px">⏱️</span></button>
          <button id="sound-select-btn" class="icon-btn" title="Change Sound"><span style="font-size:15px">🎵</span></button>
          <button id="sound-toggle" class="icon-btn" title="Toggle Sound">
            <svg id="sound-on-icon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <svg id="sound-off-icon" class="icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          </button>
          <button id="logout-btn" class="icon-btn" title="Logout">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
      <div id="settings-menu" class="sound-menu hidden">
        <div class="settings-row">
          <label class="settings-label">Same Dish Match Window — orders within this many minutes of each other will be flagged as the same batch</label>
          <div class="settings-input-row">
            <input type="number" id="window-input" min="1" max="60" value="5">
            <span class="prep-unit">min</span>
            <button class="sound-test-btn" id="window-save-btn">Save</button>
          </div>
        </div>
      </div>
      <div id="sound-menu" class="sound-menu hidden">
        <button class="sound-option active" data-sound="bell">🔔 Classic Bell</button>
        <button class="sound-option" data-sound="chime">✨ Gentle Chime</button>
        <button class="sound-option" data-sound="alert">⚡ Alert Beep</button>
        <button class="sound-option" data-sound="melody">🎵 Soft Melody</button>
        <button class="sound-test-btn" id="test-sound-btn">▶ Test Sound</button>
      </div>
      <div class="search-row">
        <div class="search-bar">
          <svg class="search-icon icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Table no. / dish name / 'hd' for delivery" autocomplete="off">
        </div>
      </div>
    </header>

    <div class="stats-row" id="stats-row">
      <div class="stat-card"><span class="stat-number amber" id="stat-pending">0</span><span class="stat-label">Pending</span></div>
      <div class="stat-card"><span class="stat-number blue" id="stat-confirmed">0</span><span class="stat-label">Confirmed</span></div>
      <div class="stat-card"><span class="stat-number green" id="stat-ready">0</span><span class="stat-label">Ready</span></div>
      <div class="stat-card hidden" id="stat-card-delivery"><span class="stat-number orange" id="stat-delivery">0</span><span class="stat-label">Delivery</span></div>
      <div class="stat-card stat-card-wide"><span class="stat-number red" id="stat-calls">0</span><span class="stat-label">Calls</span></div>
    </div>

    <div class="tab-bar" id="tab-bar">
      <button class="tab active" data-tab="confirmation"><span class="tab-text">Pending</span><span class="tab-badge" id="badge-confirmation">0</span></button>
      <button class="tab" data-tab="processing"><span class="tab-text">Progress</span><span class="tab-badge" id="badge-processing">0</span></button>
      <button class="tab" data-tab="waiter"><span class="tab-text">Calls</span><span class="tab-badge" id="badge-waiter">0</span></button>
      <button class="tab" data-tab="batch"><span class="tab-text">Batch</span><span class="tab-badge" id="badge-batch">0</span></button>
    </div>

    <main class="order-list" id="order-list"></main>
  </div>

  <div id="toast" class="toast hidden"><span id="toast-msg"></span></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
